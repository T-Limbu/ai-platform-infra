services:
  # Production Fullstack Web Service (main branch)
  # LOCKED DOWN: autoDeploy is explicitly disabled to guarantee unpinned commits never ship to production.
  - type: web
    name: ai-platform-oplox-prod
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    branch: main
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod
      - key: NODE_VERSION
        value: 20

  # QA / Staging Fullstack Web Service (dev branch)
  # CONTINUOUS: autoDeploy is enabled for rapid dogfooding and non-prod end-to-end QA verification.
  - type: web
    name: ai-platform-oplox-qa
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    branch: dev
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: qa
      - key: NODE_VERSION
        value: 20
